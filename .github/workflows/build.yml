name: Build and deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Workaround: src/lib/gramjs/crypto/RSA.ts imports 'big-integer' directly,
      # but it's missing from package.json/package-lock.json in this fork.
      - name: Install missing big-integer dependency
        run: npm install big-integer --no-save

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build production bundle
        env:
          NODE_ENV: production
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          # base_url from configure-pages already ends with a trailing slash
          BASE_URL: ${{ steps.pages.outputs.base_url }}/
        run: npm run build:production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
